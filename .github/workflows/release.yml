name: Release API beta

on:
  workflow_dispatch:
    inputs:
      version:
        description: Reviewed API SemVer prerelease (X.Y.Z-beta.N)
        type: string
        required: true
      source_sha:
        description: Exact reviewed main commit (40 lowercase hexadecimal characters)
        type: string
        required: true
      expected_sha256:
        description: Approved tarball SHA256 (64 lowercase hexadecimal characters)
        type: string
        required: true
      promote_latest:
        description: Also point latest to this beta (requires explicit owner approval)
        type: boolean
        default: false
      expected_latest:
        description: Expected previous latest version when promoting (required if promote_latest is true)
        type: string

permissions:
  contents: read

concurrency:
  group: npm-api-beta-stage
  cancel-in-progress: false

env:
  API_VERSION: ${{ inputs.version }}
  SOURCE_SHA: ${{ inputs.source_sha }}
  EXPECTED_SHA256: ${{ inputs.expected_sha256 }}
  PROMOTE_LATEST: ${{ inputs.promote_latest }}
  EXPECTED_LATEST: ${{ inputs.expected_latest }}

jobs:
  prepare:
    if: github.repository == 'pomeloanalytics/pomelo-js' && github.ref == 'refs/heads/main' && github.ref_protected
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      artifact_id: ${{ steps.tarball.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - name: Verify reviewed source and version
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          import { readFileSync } from 'node:fs';
          const git = (...args) => execFileSync('git', args, { encoding: 'utf8' }).trim();
          assert.ok(/^[a-f0-9]{40}$/.test(process.env.SOURCE_SHA), 'Invalid source SHA');
          assert.ok(/^[a-f0-9]{64}$/.test(process.env.EXPECTED_SHA256), 'Invalid tarball SHA256');
          assert.equal(process.env.GITHUB_SHA, process.env.SOURCE_SHA, 'Dispatch source mismatch');
          assert.equal(git('rev-parse', 'HEAD'), process.env.SOURCE_SHA, 'Checkout source mismatch');
          assert.equal(git('ls-remote', 'origin', 'refs/heads/main').split(/\s+/)[0], process.env.SOURCE_SHA, 'Main has changed');
          const pkg = JSON.parse(readFileSync('packages/api/package.json', 'utf8'));
          assert.equal(pkg.name, '@pomeloanalytics/api');
          assert.match(pkg.version, /^(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)-beta\.(?:0|[1-9]\d*)$/, 'Only beta prereleases may be staged');
          assert.equal(process.env.API_VERSION, pkg.version, 'Package version mismatch');
          assert.equal(git('rev-parse', `refs/tags/api-v${pkg.version}^{commit}`), process.env.SOURCE_SHA, 'Source tag mismatch');
          NODE
      - name: Verify tooling and run existing checks
        run: |
          test "$(node --version)" = 'v24.22.1'
          test "$(npm --version)" = '11.19.1'
          npm ci --ignore-scripts
          npm run check
      - name: Pack and verify approved bytes
        run: |
          mkdir -p .artifacts
          npm pack --workspace @pomeloanalytics/api --ignore-scripts --json --pack-destination .artifacts > "$RUNNER_TEMP/api-pack.json"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { readFileSync } from 'node:fs';
          const [pack] = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/api-pack.json`, 'utf8'));
          assert.equal(pack.name, '@pomeloanalytics/api');
          assert.equal(pack.version, process.env.API_VERSION);
          assert.equal(pack.files.length, 16, 'Unexpected tarball file count');
          for (const file of pack.files) {
            assert.ok(/^(?:package\.json|README\.md|CHANGELOG\.md|LICENSE|dist\/[a-zA-Z0-9/_-]+\.(?:js|d\.ts))$/.test(file.path), 'Unexpected tarball member');
          }
          const bytes = readFileSync(`.artifacts/${pack.filename}`);
          assert.equal(createHash('sha256').update(bytes).digest('hex'), process.env.EXPECTED_SHA256, 'Tarball checksum mismatch');
          NODE
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: tarball
        with:
          name: api-beta-tarball-${{ github.run_attempt }}
          path: .artifacts/pomeloanalytics-api-${{ inputs.version }}.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: prepare
    if: github.repository == 'pomeloanalytics/pomelo-js' && github.ref == 'refs/heads/main' && github.ref_protected
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: npm-beta
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - name: Use pinned npm with OIDC dist-tag support
        run: |
          npm install --global npm@11.21.1 --ignore-scripts --no-audit --no-fund --registry https://registry.npmjs.org/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact_id }}
          path: candidate
          merge-multiple: true
      - name: Verify downloaded candidate
        run: |
          test "$(node --version)" = 'v24.22.1'
          test "$(npm --version)" = '11.21.1'
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { readFileSync, readdirSync } from 'node:fs';
          assert.equal(process.env.GITHUB_REF, 'refs/heads/main');
          assert.equal(process.env.GITHUB_SHA, process.env.SOURCE_SHA, 'Dispatch source mismatch');
          assert.match(process.env.API_VERSION, /^(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)-beta\.(?:0|[1-9]\d*)$/, 'Only beta prereleases may be staged');
          const filename = `pomeloanalytics-api-${process.env.API_VERSION}.tgz`;
          assert.deepEqual(readdirSync('candidate'), [filename], 'Unexpected downloaded files');
          const bytes = readFileSync(`candidate/${filename}`);
          assert.equal(createHash('sha256').update(bytes).digest('hex'), process.env.EXPECTED_SHA256, 'Downloaded checksum mismatch');
          NODE
      - name: Publish approved beta and verify registry with OIDC
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          import { createHash } from 'node:crypto';
          import { writeFileSync } from 'node:fs';
          const name = '@pomeloanalytics/api';
          const registry = 'https://registry.npmjs.org/';
          const version = process.env.API_VERSION;
          const versionUrl = `${registry}@pomeloanalytics%2fapi/${version}`;
          const tagsUrl = `${registry}-/package/@pomeloanalytics%2fapi/dist-tags`;
          const promote = process.env.PROMOTE_LATEST === 'true';
          const npm = (...args) => execFileSync('npm', [...args, '--registry', registry], { encoding: 'utf8', stdio: ['ignore', 'pipe', 'inherit'] });
          const read = async (url, timeoutMs = 5000, allowMissing = false) => {
            const response = await fetch(url, { headers: { 'Cache-Control': 'no-cache' }, cache: 'no-store', signal: AbortSignal.timeout(timeoutMs) });
            if (allowMissing && response.status === 404) {
              await response.body?.cancel();
              return null;
            }
            assert.ok(response.ok, `Registry read failed: ${response.status}`);
            const value = await response.json();
            assert.ok(value && typeof value === 'object' && !Array.isArray(value), 'Invalid registry metadata');
            return value;
          };
          const readSnapshot = async (timeoutMs = 5000) => {
            const [metadata, tags] = await Promise.all([read(versionUrl, timeoutMs, true), read(tagsUrl, timeoutMs)]);
            for (const alias of ['beta', 'latest']) {
              assert.ok(tags[alias] === undefined || (typeof tags[alias] === 'string' && tags[alias].trim()), 'Invalid registry alias');
            }
            return { metadata, tags };
          };
          const verifyArchive = async (metadata, timeoutMs = 5000) => {
            assert.equal(metadata.name, name);
            assert.equal(metadata.version, version);
            assert.equal(new URL(metadata.dist.tarball).origin, registry.slice(0, -1));
            const response = await fetch(metadata.dist.tarball, { signal: AbortSignal.timeout(timeoutMs) });
            assert.ok(response.ok, `Registry archive read failed: ${response.status}`);
            const bytes = Buffer.from(await response.arrayBuffer());
            assert.equal(createHash('sha256').update(bytes).digest('hex'), process.env.EXPECTED_SHA256, 'Registry archive mismatch');
            assert.equal(`sha512-${createHash('sha512').update(bytes).digest('base64')}`, metadata.dist.integrity, 'Registry integrity mismatch');
          };
          const before = await readSnapshot();
          if (promote) {
            assert.ok(process.env.EXPECTED_LATEST, 'Explicit previous latest required');
            assert.ok([process.env.EXPECTED_LATEST, version].includes(before.tags.latest), 'Latest has changed');
          }
          const existing = before.metadata;
          assert.ok(existing || (before.tags.beta !== version && before.tags.latest !== version), 'Version metadata missing while tags select candidate; no publish sent');
          if (existing) await verifyArchive(existing);
          else npm('publish', `./candidate/pomeloanalytics-api-${version}.tgz`, '--ignore-scripts', '--tag', 'beta', '--access', 'public', '--provenance', '--json', '--loglevel=error');
          // Registry reads may lag an acknowledged write. Never replay a write here.
          const deadline = Date.now() + 30000;
          let reads = 0;
          const remainingTimeout = () => {
            const remaining = deadline - Date.now();
            assert.ok(remaining > 0, 'Registry verification deadline expired');
            return Math.min(5000, remaining);
          };
          const observe = async (ready) => {
            while (reads < 10 && Date.now() < deadline) {
              const snapshot = await readSnapshot(remainingTimeout());
              reads++;
              const tags = snapshot.tags;
              assert.ok([before.tags.beta, version].includes(tags.beta), 'Unexpected beta tag');
              assert.ok([before.tags.latest, version].includes(tags.latest), 'Latest changed before promotion');
              if (Date.now() < deadline && ready(snapshot)) return snapshot;
              if (reads < 10 && Date.now() < deadline) {
                await new Promise((resolve) => setTimeout(resolve, Math.min(1000, deadline - Date.now())));
              }
            }
            throw new Error('Registry verification pending after acknowledged write; no write replayed');
          };
          const published = await observe((snapshot) => Boolean(snapshot.metadata));
          await verifyArchive(published.metadata, remainingTimeout());
          const current = (await observe((snapshot) => snapshot.tags.beta === version)).tags;
          assert.ok(Date.now() < deadline, 'Registry verification deadline expired before tag update');
          let after = current;
          if (promote && current.latest !== version) {
            assert.ok(reads < 10, 'Registry verification pending before tag update; no tag write sent');
            npm('dist-tag', 'add', `${name}@${version}`, 'latest');
            after = (await observe((snapshot) => snapshot.tags.beta === version && snapshot.tags.latest === version)).tags;
          }
          assert.equal(after.beta, version);
          assert.equal(after.latest, promote ? version : before.tags.latest, 'Unexpected latest tag');
          const receipt = { name, version, source: process.env.SOURCE_SHA, sha256: process.env.EXPECTED_SHA256, alreadyPublished: Boolean(existing), before: before.tags, after };
          writeFileSync(`${process.env.RUNNER_TEMP}/release-result.json`, `${JSON.stringify(receipt, null, 2)}\n`);
          console.log(JSON.stringify(receipt));
          NODE
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: api-beta-release-result-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-result.json
          if-no-files-found: error
          retention-days: 1
